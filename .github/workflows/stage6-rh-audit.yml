name: Stage 6 RH reduction audit

on:
  push:
    branches: [main, release-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Stage 6 RH reduction audit on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out the exact workflow source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the audit parser
        shell: bash
        run: python scripts/test_check_axioms.py
      - name: Build HodgeProofHP.Stage6ThetaJensenRiemannHypothesisEquivalence
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: "false"
          build: "true"
          build-args: HodgeProofHP.Stage6ThetaJensenRiemannHypothesisEquivalence
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Verify final theorem dependencies and source revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          lake env lean --version
          LOG=stage6-final-axioms.log
          : > "$LOG"
          lake env lean HodgeProofHP/Stage6ThetaJensenRiemannHypothesisEquivalence.lean 2>&1 | tee -a "$LOG"
          python scripts/check_axioms.py "$LOG" \
            --expect HodgeProofHP.hpThetaJensen_RH_iff_xiRealZeros \
            --expect HodgeProofHP.hpThetaJensen_RH_iff_negativeRealZeros \
            --expect HodgeProofHP.hpThetaJensen_RH_iff_nonpositiveRealZeros \
            --expect HodgeProofHP.hpThetaJensen_nonrealZeroExclusion_iff_negativeRealZeros \
            --expect HodgeProofHP.hpThetaJensen_RH_iff_nonrealZeroExclusion \
            --expect HodgeProofHP.hpThetaJensen_RH_of_nonrealZeroExclusion
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve final axiom reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-rh-audit-${{ matrix.os }}
          path: stage6-final-axioms.log
          if-no-files-found: warn
