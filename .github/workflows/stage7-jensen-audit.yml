name: Stage 7 Jensen rescaling audit

on:
  push:
    branches: [research/stage7-jensen-criterion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Stage 7 rescaling on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate axiom parser
        shell: bash
        run: python scripts/test_check_axioms.py
      - name: Build Stage 7 convergence and cofinal criterion
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          auto-config: "false"
          build: "true"
          build-args: HodgeProofHP.Stage7ThetaJensenCofinalCriterion
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Verify all Stage 7 theorem dependencies and tracked sources
        shell: bash
        run: |
          bash scripts/audit_stage7_jensen_rescaling.sh
          bash scripts/audit_stage7_jensen_coefficient_limits.sh
          bash scripts/audit_stage7_jensen_polynomial_expansion.sh
          bash scripts/audit_stage7_jensen_uniform_convergence.sh
          bash scripts/audit_stage7_jensen_locally_uniform.sh
          bash scripts/audit_stage7_jensen_hurwitz_disk.sh
          bash scripts/audit_stage7_jensen_conditional_rh.sh
          bash scripts/audit_stage7_jensen_cofinal_criterion.sh
          bash scripts/audit_stage7_jensen_assumption_frontier.sh
          bash scripts/audit_stage7_jensen_cubic_algebra.sh
          bash scripts/audit_stage7_jensen_cubic_integral.sh
          bash scripts/audit_stage7_jensen_cubic_signed_cells.sh
          bash scripts/audit_stage7_jensen_bernstein_bounds.sh
          bash scripts/audit_stage7_jensen_bernstein_coefficients.sh
          bash scripts/audit_stage7_jensen_cubic_weight_all.sh
          bash scripts/audit_stage7_jensen_cubic_batch_integrals.sh
          bash scripts/audit_stage7_jensen_cubic_rectangles.sh
          bash scripts/audit_stage7_jensen_cubic_finite_integrals.sh
          bash scripts/audit_stage7_jensen_cubic_signs.sh
          bash scripts/audit_stage7_jensen_cubic_real_roots.sh
          bash scripts/audit_stage7_jensen_cubic_factorization.sh
          bash scripts/audit_stage7_jensen_cubic_assumption_frontier.sh
          bash scripts/audit_stage7_jensen_turan_moment_equivalence.sh
          bash scripts/audit_stage7_jensen_weighted_tail_foundations.sh
          bash scripts/audit_stage7_jensen_weighted_tail_derivative.sh
          bash scripts/audit_stage7_jensen_weighted_tail_positive.sh
          bash scripts/audit_stage7_jensen_square_variable_tail.sh
          bash scripts/audit_stage7_jensen_square_tail_log_curvature.sh
          bash scripts/audit_stage7_jensen_kernel_derivative_criterion.sh
          bash scripts/audit_stage7_jensen_kernel_derivative_majorant.sh
          bash scripts/audit_stage7_jensen_sixth_moment_tail.sh
          bash scripts/audit_stage7_jensen_sixth_moment_cells.sh
          bash scripts/audit_stage7_jensen_sixth_moment_rectangles.sh
          bash scripts/audit_stage7_jensen_sixth_moment_certified.sh
          git diff --exit-code
          git diff --cached --exit-code
      - name: Preserve axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-rescaling-${{ matrix.os }}
          path: |
            stage7-jensen-rescaling-axioms.log
            stage7-jensen-coefficient-limit-axioms.log
            stage7-jensen-polynomial-expansion-axioms.log
            stage7-jensen-uniform-convergence-axioms.log
            stage7-jensen-locally-uniform-axioms.log
            stage7-jensen-hurwitz-disk-axioms.log
            stage7-jensen-conditional-rh-axioms.log
            stage7-jensen-cofinal-criterion-axioms.log
            stage7-jensen-assumption-frontier-axioms.log
            stage7-jensen-cubic-algebra-axioms.log
            stage7-jensen-cubic-integral-axioms.log
            stage7-jensen-cubic-signed-cells-axioms.log
            stage7-jensen-bernstein-bounds-axioms.log
            stage7-jensen-bernstein-coefficients-axioms.log
            stage7-jensen-cubic-weight-batch*-axioms.log
            stage7-jensen-cubic-partition-axioms.log
            stage7-jensen-cubic-batch-integrals-neg*-axioms.log
            stage7-jensen-cubic-rectangles-neg*-axioms.log
            stage7-jensen-cubic-finite-integral-neg*-axioms.log
            stage7-jensen-cubic-tail-axioms.log
            stage7-jensen-cubic-signs-axioms.log
            stage7-jensen-cubic-real-roots-axioms.log
            stage7-jensen-cubic-factorization-axioms.log
            stage7-jensen-cubic-assumption-frontier-axioms.log
            stage7-jensen-turan-moment-equivalence-axioms.log
            stage7-jensen-weighted-tail-foundations-axioms.log
            stage7-jensen-weighted-tail-derivative-axioms.log
            stage7-jensen-weighted-tail-positive-axioms.log
            stage7-jensen-square-variable-tail-axioms.log
            stage7-jensen-square-tail-log-curvature-axioms.log
            stage7-jensen-kernel-derivative-criterion-axioms.log
            stage7-jensen-kernel-derivative-majorant-axioms.log
            stage7-jensen-sixth-moment-tail-axioms.log
            stage7-jensen-sixth-moment-cells-axioms.log
            stage7-jensen-sixth-moment-rectangles-axioms.log
            stage7-jensen-sixth-moment-certified-axioms.log
          if-no-files-found: warn





